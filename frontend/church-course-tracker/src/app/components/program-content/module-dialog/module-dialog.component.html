<div class="module-dialog">
  <h2 mat-dialog-title>
    {{ isEditing ? 'Edit Category' : 'Create New Category' }}
  </h2>
  
  <mat-dialog-content>
    <form [formGroup]="moduleForm" class="module-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category Title</mat-label>
        <input matInput formControlName="title">
        <mat-icon matSuffix>title</mat-icon>
        <mat-error *ngIf="shouldShowError('title')">{{ getErrorMessage('title') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width" floatLabel="always">
        <mat-label>Description</mat-label>
        <textarea 
          matInput 
          formControlName="description" 
          rows="4">
        </textarea>
        <mat-icon matSuffix>description</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Order Index</mat-label>
        <input 
          matInput 
          type="number" 
          formControlName="order_index" 
          min="0">
        <mat-icon matSuffix>sort</mat-icon>
        <mat-hint>Lower numbers appear first in the category list</mat-hint>
        <mat-error *ngIf="shouldShowError('order_index')">{{ getErrorMessage('order_index') }}</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" [disabled]="isSubmitting">
      Cancel
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onSubmit()" 
      [disabled]="!moduleForm.valid || isSubmitting">
      <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
      <span *ngIf="!isSubmitting">{{ isEditing ? 'Update' : 'Create' }}</span>
    </button>
  </mat-dialog-actions>
</div>

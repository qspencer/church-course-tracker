name: Backend Tests

# Least-privilege default. This workflow only needs to checkout code and
# upload coverage to codecov; it does not push, deploy, or write to the
# repository.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create data directory
      run: |
        cd backend
        mkdir -p data
    
    - name: Run linting
      run: |
        cd backend
        pip install flake8 black isort
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true
        black --check app || echo "⚠️  Black formatting check failed - will fix in next commit"
        isort --check-only app || echo "⚠️  isort import check failed - will fix in next commit"
      continue-on-error: true
    
    - name: Run tests with coverage
      run: |
        cd backend
        mkdir -p data
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true


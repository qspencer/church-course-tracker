name: E2E Tests

# Least-privilege default. This workflow runs Playwright against
# production; it does not push, deploy, or write to the repository.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Reduced to 1 hour since we're only testing chromium in CI
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: tests/e2e/package-lock.json
    
    - name: Install dependencies
      working-directory: tests/e2e
      run: npm ci
    
    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install --with-deps chromium
    
    - name: Run E2E tests
      working-directory: tests/e2e
      run: npm test
      timeout-minutes: 55  # Slightly less than job timeout to allow for cleanup
      env:
        CI: true
        BASE_URL: https://apps.quentinspencer.com
        PLAYWRIGHT_BASE_URL: https://apps.quentinspencer.com
        E2E_SKIP_DATA_LOAD: 'true'  # Skip data loading when testing against production
        E2E_SKIP_DATA_CLEANUP: 'true'  # Skip data cleanup when testing against production
        # Credentials for auth-required tests. See tests/e2e/utils/auth.ts for
        # the resolution order. Usernames are NOT secret (they're just role
        # names that exist in the prod DB) so they have plain defaults here.
        # Passwords come from repository secrets. If a secret is not set,
        # ${{ secrets.X }} resolves to an empty string and any test that
        # requires that credential will test.skip() cleanly rather than fail.
        # To enable admin-authenticated tests: in the GitHub repository
        # settings, add a secret named E2E_ADMIN_PASSWORD with the value of
        # the current production admin password (also stored in AWS Secrets
        # Manager under church-course-tracker-secrets:ADMIN_PASSWORD). The
        # staff/viewer accounts are not auto-provisioned in production; if
        # you create them manually, add the corresponding secrets here.
        E2E_ADMIN_USERNAME: Admin
        E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        E2E_STAFF_USERNAME: staff
        E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        E2E_VIEWER_USERNAME: viewer
        E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: tests/e2e/test-results/
        retention-days: 7


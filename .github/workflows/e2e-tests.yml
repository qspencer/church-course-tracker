name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Increased to 2 hours to accommodate 915 E2E tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      working-directory: tests/e2e
      run: npm ci
    
    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install --with-deps chromium
    
    - name: Run E2E tests
      working-directory: tests/e2e
      run: npm test
      timeout-minutes: 110  # Slightly less than job timeout to allow for cleanup
      env:
        BASE_URL: https://apps.quentinspencer.com
        PLAYWRIGHT_BASE_URL: https://apps.quentinspencer.com
        E2E_SKIP_DATA_LOAD: 'true'  # Skip data loading when testing against production
        E2E_SKIP_DATA_CLEANUP: 'true'  # Skip data cleanup when testing against production
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: tests/e2e/test-results/
        retention-days: 7


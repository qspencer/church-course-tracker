name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Workflow-level least-privilege defaults. Each job opts in to additional
# permissions it needs (id-token: write for OIDC; contents: write only on
# deploy-frontend which pushes the version bump back to the repo).
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: church-course-tracker-backend
  ECS_CLUSTER: church-course-tracker-cluster
  ECS_SERVICE: church-course-tracker-service
  ECS_TASK_FAMILY: church-course-tracker-backend
  CONTAINER_NAME: backend
  S3_BUCKET: ${{ secrets.S3_STATIC_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  # OIDC role created by infrastructure/github_actions_oidc.tf
  # (resource: aws_iam_role.github_actions_app_deploy). Replaces the
  # long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY pattern that
  # the 2026-05-18 evaluation §3.3 finding GH-01 flagged as a P0.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::334581603621:role/church-course-tracker-github-actions-app-deploy

jobs:
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for aws-actions/configure-aws-credentials OIDC
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    # Immutable deploys: images are tagged with the commit SHA only (the ECR
    # repo enforces tag immutability, so no more mutable :latest). The tag
    # existing already means a workflow re-run after a successful push -
    # skip the build rather than fail on the immutable-tag conflict.
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        if aws ecr describe-images --repository-name $ECR_REPOSITORY \
             --image-ids imageTag=$IMAGE_TAG --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          echo "Image $IMAGE_TAG already in ECR (workflow re-run); skipping build/push"
        else
          cd backend
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        fi
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # Register a new task definition revision pinned to the SHA-tagged image
    # instead of force-redeploying whatever :latest happens to point at.
    # Every deploy is now traceable to a commit and rollback is "deploy the
    # previous revision". Terraform ignores these revisions (see ecs.tf
    # lifecycle blocks). Database migrations still run at container startup.
    - name: Download current task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_FAMILY }} \
          --query taskDefinition > task-definition.json

    - name: Render task definition with new image
      id: render-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy new task definition revision
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        wait-for-minutes: 15
  
  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    # Don't ship a frontend that may expect new API behavior when the
    # backend deploy failed.
    needs: deploy-backend
    permissions:
      id-token: write  # required for OIDC role assumption
      contents: write  # required to push version updates back to repo

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Increment version
      id: increment-version
      run: |
        chmod +x scripts/increment-version.sh
        # Capture only stdout (version number), status messages go to stderr
        NEW_VERSION=$(scripts/increment-version.sh 2>/dev/null)
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "✅ Version incremented to $NEW_VERSION"
    
    - name: Commit version update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # Pull latest changes before committing
        git pull --rebase origin ${{ github.ref_name }} || echo "Pull failed, continuing..."
        
        git add frontend/church-course-tracker/version.txt \
                frontend/church-course-tracker/src/environments/environment.ts \
                frontend/church-course-tracker/src/environments/environment.prod.ts \
                frontend/church-course-tracker/src/environments/environment.dev.ts
        if git diff --staged --quiet; then
          echo "No version changes to commit"
        else
          git commit -m "Auto-increment version to ${{ steps.increment-version.outputs.version }} [skip ci]"
          # Pull again before pushing to handle any concurrent changes
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, but continuing with build"
        fi
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/church-course-tracker/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd frontend/church-course-tracker
        npm ci
    
    - name: Build frontend
      run: |
        cd frontend/church-course-tracker
        npm run build -- --configuration=production --base-href=/churchcoursetracker/
      env:
        NODE_ENV: production
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to S3
      run: |
        aws s3 sync frontend/church-course-tracker/dist/church-course-tracker/ s3://${{ env.S3_BUCKET }}/churchcoursetracker/ --delete
    
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/churchcoursetracker/*"


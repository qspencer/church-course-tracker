name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: church-course-tracker-backend
  ECS_CLUSTER: church-course-tracker-cluster
  ECS_SERVICE: church-course-tracker-service
  S3_BUCKET: ${{ secrets.S3_STATIC_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker build -f Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
           # Database migrations will be handled by the ECS container startup
    
    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --force-new-deployment
    
    - name: Wait for service to be stable
      timeout-minutes: 15
      run: |
        echo "Waiting for ECS service to stabilize..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }} || {
          echo "⚠️  Wait command timed out or failed. Checking service status..."
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{runningCount:runningCount,desiredCount:desiredCount,status:status}' || true
          # Don't fail the workflow if wait times out but service is actually running
          RUNNING=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].runningCount' --output text 2>/dev/null || echo "0")
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].desiredCount' --output text 2>/dev/null || echo "0")
          if [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
            echo "✅ Service is running ($RUNNING/$DESIRED tasks). Continuing..."
            exit 0
          else
            echo "❌ Service is not stable (running: $RUNNING, desired: $DESIRED)"
            exit 1
          fi
        }
        echo "✅ Service is stable!"
  
  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push version updates back to repo
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
    
    - name: Install bc (for version calculation)
      run: sudo apt-get update && sudo apt-get install -y bc
    
    - name: Increment version
      id: increment-version
      run: |
        chmod +x scripts/increment-version.sh
        # Capture only stdout (version number), status messages go to stderr
        NEW_VERSION=$(scripts/increment-version.sh 2>/dev/null)
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "✅ Version incremented to $NEW_VERSION"
    
    - name: Commit version update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # Pull latest changes before committing
        git pull --rebase origin ${{ github.ref_name }} || echo "Pull failed, continuing..."
        
        git add frontend/church-course-tracker/version.txt \
                frontend/church-course-tracker/src/environments/environment.ts \
                frontend/church-course-tracker/src/environments/environment.prod.ts
        if git diff --staged --quiet; then
          echo "No version changes to commit"
        else
          git commit -m "Auto-increment version to ${{ steps.increment-version.outputs.version }} [skip ci]"
          # Pull again before pushing to handle any concurrent changes
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, but continuing with build"
        fi
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/church-course-tracker/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd frontend/church-course-tracker
        npm ci
    
    - name: Build frontend
      run: |
        cd frontend/church-course-tracker
        npm run build -- --configuration=production --base-href=/churchcoursetracker/
      env:
        NODE_ENV: production
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/church-course-tracker/dist/church-course-tracker/ s3://${{ env.S3_BUCKET }}/churchcoursetracker/ --delete
    
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/churchcoursetracker/*"


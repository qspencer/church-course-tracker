site_name: Church Course Tracker Documentation
site_description: User documentation for Church Course Tracker
# site_url is set for production deployment only
# For local development, leave this commented out or use: site_url: http://127.0.0.1:8000
site_url: https://docs.quentinspencer.com/churchcoursetracker
site_author: Church Course Tracker Team

# Configure for path-based URL structure
use_directory_urls: true

# Repository information (optional)
repo_name: church-course-tracker
repo_url: https://github.com/qspencer/church-course-tracker

theme:
  name: material
  custom_dir: docs_overrides
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide.md
  - Features: features.md
  - Custom Attributes: custom-attributes.md
  - Documentation Guide: DOCUMENTATION_GUIDE.md

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - theme/custom.css

extra:
  version: 1.0.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qspencer/church-course-tracker
  analytics:
    provider: null  # No analytics tracking for privacy
  consent:
    title: Cookie consent
    description: >- 
      This documentation site does not use cookies or tracking.
      All content is served statically.

